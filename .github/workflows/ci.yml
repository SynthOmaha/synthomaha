name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    validate:
        uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0
        with:
            single-environment: true

    # Cloudflare Worker deploy (trial on synthnight.com, see #109).
    # synthomaha.net is still built and served by Netlify's git integration.
    deploy:
        name: Deploy (Cloudflare)
        needs: validate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        concurrency:
            group: deploy-cloudflare-prod
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            - uses: taraxvoid/voidflow/actions/bun-install@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0

            - name: Build
              run: bun run build

            - id: env
              uses: taraxvoid/voidflow/actions/branch-env-map@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0
              with:
                  single-environment: 'true'

            - uses: taraxvoid/voidflow/actions/cloudflare-deploy@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0
              with:
                  env: ${{ steps.env.outputs.env }}
                  cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
